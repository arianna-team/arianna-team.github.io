<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Thank you | ARIANNA</title>
  <style>
    :root { --ink:#0f1e2b; --muted:#5b6b7a; --accent:#f28a1a; --bg:#f4f7f8; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--ink); font-family:Montserrat,Arial,sans-serif; }
    main { width:min(680px,100%); padding:clamp(28px,6vw,56px); border-radius:24px; background:#fff; box-shadow:0 20px 50px rgba(15,30,43,.12); text-align:center; }
    h1 { margin:0 0 16px; font-size:clamp(30px,5vw,48px); font-weight:500; text-transform:uppercase; }
    p { margin:0 auto 24px; max-width:520px; color:var(--muted); line-height:1.7; }
    a { display:inline-flex; min-height:46px; align-items:center; justify-content:center; padding:12px 20px; border-radius:999px; background:var(--accent); color:#fff; font-weight:700; text-decoration:none; }
  </style>
</head>
<body>
  <main>
    <h1>Thank you</h1>
